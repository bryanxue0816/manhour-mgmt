# Reverse proxy for the man-hour management app.
#
# ============================================================================
# NOT VERIFIED ON A MACHINE. No nginx and no Docker on the machine this was
# written on. The directives are drawn from the app's measured behaviour
# (upload ceilings, Server Action limits, route list), but this config has never
# been loaded. Run `nginx -t` before trusting it, and see docs/DEPLOY.md.
# ============================================================================
#
# Two jobs, and only two:
#   1. Enforce D-008 - v1 has no login; an intranet IP allowlist is the only
#      access control. This file IS the authentication layer. Treat edits to
#      the allow/deny block as security changes.
#   2. Terminate client connections and forward to the Next.js server, which is
#      not exposed to the network directly.

# One worker is ample: the upstream is a single Node process and the expected
# load is a few dozen internal users. `auto` would spawn one per core and each
# would hold idle keepalive connections to the same single upstream.
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # $http_x_forwarded_for is logged in addition to $remote_addr so that a
    # denied request can be traced when someone later inserts another proxy in
    # front of this one - at which point $remote_addr becomes that proxy and
    # the allowlist below silently stops meaning what it says. See the warning
    # in the server block.
    log_format main '$remote_addr - [$time_local] "$request" '
                    '$status $body_bytes_sent '
                    'xff="$http_x_forwarded_for" rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    server_tokens off;

    # Keepalive to the browser. Must be >= the app container's
    # KEEP_ALIVE_TIMEOUT, or nginx reuses a connection the upstream has already
    # closed and the operator sees a sporadic 502 on an otherwise idle system.
    keepalive_timeout 65;

    # Compression. Excel uploads are already compressed containers (.xlsx is a
    # ZIP; .xls is OLE2) so gzip_types deliberately omits spreadsheet MIME
    # types - recompressing them burns CPU for nothing.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript
                      application/javascript application/json
                      application/manifest+json image/svg+xml;

    upstream manhour_app {
        # `app` is the compose service name, resolved by Docker's embedded DNS.
        server app:3000;

        # Keep idle connections open to the upstream. Without this, nginx opens
        # a fresh TCP connection per proxied request.
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        # --------------------------------------------------------------------
        # D-008 ACCESS CONTROL - this is the whole authentication story
        # --------------------------------------------------------------------
        # There is no login. Anyone who reaches this server and passes the
        # allowlist can read and MODIFY all attendance and plan data, including
        # the /admin page.
        #
        # ### YOU MUST EDIT THE RANGES BELOW BEFORE DEPLOYING ###
        #
        # The values here are RFC 1918 placeholders, not the target network. A
        # deployment that keeps all three lines grants access to essentially
        # every private network - which, on a machine with any routing between
        # segments, is not the intranet restriction D-007/D-008 intended.
        # Replace with the actual office subnet(s), e.g.
        #     allow 10.20.30.0/24;
        #
        # Ordering is significant: nginx evaluates allow/deny top-down and
        # stops at the first match, so `deny all` must come last.
        #
        # WARNING - the addresses matched here are $remote_addr, the peer's
        # address as seen by THIS nginx. That is correct only while nginx is the
        # first hop. If a load balancer, another nginx, or a corporate proxy is
        # ever placed in front, every request will arrive from that device's
        # address, it will match (or fail to match) as one client, and this
        # allowlist becomes meaningless without announcing that it has. Switching
        # to real_ip_header X-Forwarded-For plus set_real_ip_from is the fix, and
        # it must be paired with trusting ONLY that proxy - an untrusted
        # X-Forwarded-For is client-controlled and trivially spoofed.
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;

        # --------------------------------------------------------------------
        # Upload ceiling
        # --------------------------------------------------------------------
        # Sized to sit BETWEEN the app's own limits, on purpose:
        #
        #   MAX_FILE_BYTES   4 MB   (upload-guard.ts, per file)
        #   MAX_BATCH_BYTES 12 MB   (upload-guard.ts, whole batch, max 10 files)
        #   bodySizeLimit   16 MB   (next.config.mjs, Server Action ceiling)
        #
        # 14 MB is above the app's 12 MB batch cap and below Next's 16 MB. That
        # ordering is the point: an oversized batch is rejected by
        # upload-guard.ts, which returns a specific Chinese message naming the
        # offending file and the limit. If client_max_body_size were set to 12 MB
        # or lower, nginx would cut the request off first and the operator would
        # get a bare English 413 HTML page with no indication of which file was
        # too big - or worse, a browser error, since nginx may close the
        # connection mid-upload.
        client_max_body_size 14m;

        # A 450 KB .xls over a slow internal link, times ten files, needs more
        # than the 60s default for the read to complete.
        client_body_timeout 120s;

        # Static assets emitted by next build. Content-hashed filenames, so an
        # immutable far-future cache is safe and correct.
        #
        # This location exists only as an optimisation - Next serves these
        # itself, and removing this block breaks nothing. It is here so that
        # asset requests do not occupy the single Node process.
        #
        # No proxy_cache: that would need a proxy_cache_path zone declared in
        # the http block, and caching in nginx buys nothing here - the assets
        # are already on local disk inside the app container. The Cache-Control
        # header below is what actually matters, and it acts on the browser.
        location /_next/static/ {
            proxy_pass http://manhour_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;

            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        location / {
            proxy_pass http://manhour_app;

            # HTTP/1.1 with an empty Connection header is required for the
            # upstream keepalive block above to have any effect; nginx proxies
            # with HTTP/1.0 by default.
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Excel parsing plus a write transaction across up to ten files
            # takes real time. The default 60s read timeout would surface as a
            # 504 partway through an import, leaving the operator unsure
            # whether the data landed - the worst possible outcome for an
            # idempotency question. 300s is generous on purpose.
            proxy_connect_timeout 10s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;

            # Do not buffer the request body to disk before forwarding. The
            # ceiling is 14 MB, the app reads the whole body into memory
            # anyway, and buffering only adds latency plus a disk write of
            # attendance data outside the database.
            proxy_request_buffering off;
        }

        # Security headers. Deliberately conservative - this is an internal
        # tool with no embedding, no third-party scripts, and no cross-origin
        # consumers.
        #
        # No CSP is set here. Next injects inline scripts for hydration and
        # streaming, so a useful CSP needs per-request nonce plumbing through
        # the app; a hand-written one either breaks the page or degenerates to
        # 'unsafe-inline' and certifies nothing. Left as a v2 item rather than
        # shipped as decoration.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "DENY" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }
}
